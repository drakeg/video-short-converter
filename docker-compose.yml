services:
  video-short-converter:
    build:
      context: .
      args:
        NEXT_PUBLIC_AUTH_REQUIRED: ${NEXT_PUBLIC_AUTH_REQUIRED:-false}
        NEXT_PUBLIC_LOCAL_TRANSCRIPTION_PROTOTYPE: ${NEXT_PUBLIC_LOCAL_TRANSCRIPTION_PROTOTYPE:-false}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${NEXT_PUBLIC_COGNITO_DOMAIN:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID:-}
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI:-}
        NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI:-}
        NEXT_PUBLIC_PROFILE_API_BASE_URL: ${NEXT_PUBLIC_PROFILE_API_BASE_URL:-}
    ports:
      - "${APP_PORT:-3000}:80"
    restart: unless-stopped
