name: Repair dependency security lockfile

on:
  push:
    branches:
      - renovate/npm-non-major-dependencies
    paths:
      - package.json
      - .github/workflows/repair-security-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'drakeg/video-short-converter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile using npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify production dependencies
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): regenerate lockfile with patched transitive dependencies'
          git push origin HEAD:renovate/npm-non-major-dependencies
