name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate JavaScript tooling syntax
        run: |
          node scripts/check-node-runtime.mjs
          node --check jest.config.js
          node --check __mocks__/ffmpeg.js
          node --check scripts/copy-ffmpeg-core.mjs

      - name: Install dependencies
        # onnxruntime-node fetches a NuGet binary during installation; the upstream
        # endpoint can intermittently time out even when the npm registry is healthy.
        # Retry the exact lockfile install rather than skipping its install scripts.
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after three attempts"
              exit 1
            fi
            echo "::warning::npm ci attempt $attempt failed; retrying after 10 seconds"
            sleep 10
          done

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build
